name: Public methods
on:
  push:
    paths: ['public-methods/**', '.github/workflows/public-methods.yml']
  pull_request:
    paths: ['public-methods/**', '.github/workflows/public-methods.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-methods
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements-test.txt
      - run: PYTHONPATH=api python -m pytest api/tests -q
